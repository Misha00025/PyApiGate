# Пример конфигурации PyApiGate
# Скопируйте в routes.yaml и отредактируйте под свои нужды

# ─── Auth ────────────────────────────────────────────
# Определяет стратегию аутентификации.
#   strategy: rsa_jwt — JWT с RSA-256 подписью (public_key_path обязателен)
#   strategy: none — без аутентификации (только маршруты с auth: none)
# Для кастомных стратегий — @register_auth_strategy("name") в коде
# ──────────────────────────────────────────────────────
base_path: ""

auth:
  strategy: rsa_jwt
  public_key_path: /certs/public.pem
  expected_issuer: "https://auth.example.com"

services:
  example:
    base_url: "http://localhost:18080"

routes:
  - path: /hello
    methods: [GET]
    handler: hello_handler
    auth: none
    description: "Hello-world handler"

  - path: /api/users/<int:user_id>
    methods: [GET, PUT]
    proxy:
      service: example
      path: /users/{user_id}
    params:
      query: "*"
    auth: required
    description: "Proxy to example service"

  - path: /api/groups/<int:group_id>/items
    methods:
      GET:
        proxy:
          service: example
          path: /groups/{group_id}/items
        access: reader
      POST:
        proxy:
          service: example
          path: /groups/{group_id}/items
        access: writer
        params:
          body:
            ownerId: "{jwt.userId}"
    auth: required
    description: "CRUD for items with access control"
