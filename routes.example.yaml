# PyApiGate configuration example
# Copy to routes.yaml and edit for your needs

# ─── Auth ────────────────────────────────────────────
# Defines the authentication strategy.
#   strategy: oauth2_jwt — JWKS-based JWT validation (jwks_url required)
#   strategy: rsa_jwt — static RSA public key (public_key_path required)
#   strategy: none — no authentication
# For custom strategies — @register_auth_strategy("name") in code
#
# All string values support ${ENV_VAR} and ${ENV_VAR:-default}.
# ──────────────────────────────────────────────────────
base_path: ""

auth:
  strategy: oauth2_jwt
  jwks_url: "${AUTH_SERVICE_URL}/.well-known/jwks.json"
  expected_issuer: "https://auth.example.com"

services:
  example:
    base_url: "http://localhost:18080"

routes:
  - path: /hello
    methods: [GET]
    handler: hello_handler
    auth: none
    description: "Hello-world handler"

  - path: /api/users/<int:user_id>
    methods: [GET, PUT]
    proxy:
      service: example
      path: /users/{user_id}
    params:
      query: "*"
    auth: required
    description: "Proxy to example service"

  - path: /api/users/<int:user_id>/reviews
    methods:
      GET:
        proxy:
          service: example
          path: /users/{user_id}/reviews
        access: reader
      POST:
        proxy:
          service: example
          path: /users/{user_id}/reviews
        access: writer
        params:
          body:
            ownerId: "{jwt.userId}"
    auth: required
    description: "CRUD for reviews with access control"
